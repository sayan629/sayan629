<svg xmlns="http://www.w3.org/2000/svg"
    width="490"
    height="520"
    viewBox="0 0 490 520">


<style>

.card-line {
    opacity: 0;
    transform: translateY(8px);
    animation:
        lineReveal
        0.45s
        ease-out
        forwards;
}

@keyframes lineReveal {

    0% {
        opacity: 0;
        transform: translateY(8px);
    }

    100% {
        opacity: 1;
        transform: translateY(0);
    }

}

.cursor {
    animation: blink 1s steps(1) infinite;
}

@keyframes blink {

    0%, 50% {
        opacity: 1;
    }

    51%, 100% {
        opacity: 0;
    }

}

</style>


<rect
    x="0"
    y="0"
    width="490"
    height="520"
    rx="12"
    fill="#ffffff"
    stroke="#111111"
    stroke-width="2"
/>


